name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test -race ./...
      - name: Measure coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out ./internal/storage
      - name: Report coverage
        run: go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
